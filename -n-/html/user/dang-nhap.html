<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng Nhập / Đăng Ký - Nhà Sách Online</title>
    <!-- CSS hệ thống Toast Popup -->
    <link rel="stylesheet" href="../../css/style-user-chung.css">
    <!-- CSS giao diện form -->
    <link rel="stylesheet" href="../../css/user/dang-nhap.css">
</head>
<body class="auth-page">

    <!-- LỚP BACKGROUND SÓNG UỐN LƯỢN -->
    <div class="wave-bg">
        <svg class="wave-top" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 320"><path fill="#0f5132" fill-opacity="1" d="M0,64L80,96C160,128,320,192,480,186.7C640,181,800,107,960,101.3C1120,96,1280,160,1360,192L1440,224L1440,0L1360,0C1280,0,1120,0,960,0C800,0,640,0,480,0C320,0,160,0,80,0L0,0Z"></path></svg>
        <svg class="wave-bottom" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 320"><path fill="#ff5722" fill-opacity="1" d="M0,192L48,197.3C96,203,192,213,288,192C384,171,480,117,576,122.7C672,128,768,192,864,229.3C960,267,1056,277,1152,250.7C1248,224,1344,160,1392,128L1440,96L1440,320L1392,320C1344,320,1248,320,1152,320C1056,320,960,320,864,320C768,320,672,320,576,320C480,320,384,320,288,320C192,320,96,320,48,320L0,320Z"></path><path fill="#0f5132" fill-opacity="1" d="M0,256L48,245.3C96,235,192,213,288,218.7C384,224,480,256,576,256C672,256,768,224,864,197.3C960,171,1056,149,1152,160C1248,171,1344,213,1392,234.7L1440,256L1440,320L1392,320C1344,320,1248,320,1152,320C1056,320,960,320,864,320C768,320,672,320,576,320C480,320,384,320,288,320C192,320,96,320,48,320L0,320Z"></path></svg>
        <svg class="bg-book book1" viewBox="0 0 24 24" fill="#0f5132"><path d="M21 4H3a1 1 0 00-1 1v14a1 1 0 001 1h18a1 1 0 001-1V5a1 1 0 00-1-1zm-1 14H4V6h16v12zm-3-10H7v2h10V8zm0 4H7v2h10v-2z"/></svg>
        <svg class="bg-book book2" viewBox="0 0 24 24" fill="#0f5132"><path d="M21 4H3a1 1 0 00-1 1v14a1 1 0 001 1h18a1 1 0 001-1V5a1 1 0 00-1-1zm-1 14H4V6h16v12zm-3-10H7v2h10V8zm0 4H7v2h10v-2z"/></svg>
        <svg class="bg-book book3" viewBox="0 0 24 24" fill="#ff5722"><path d="M21 4H3a1 1 0 00-1 1v14a1 1 0 001 1h18a1 1 0 001-1V5a1 1 0 00-1-1zm-1 14H4V6h16v12zm-3-10H7v2h10V8zm0 4H7v2h10v-2z"/></svg>
        <svg class="bg-book book4" viewBox="0 0 24 24" fill="#0f5132"><path d="M21 4H3a1 1 0 00-1 1v14a1 1 0 001 1h18a1 1 0 001-1V5a1 1 0 00-1-1zm-1 14H4V6h16v12zm-3-10H7v2h10V8zm0 4H7v2h10v-2z"/></svg>
    </div>

    <!-- NEO BẮT TÍN HIỆU TỪ URL LẬT FORM & BẬT POPUP -->
    <span id="dang-ky-form" style="position: absolute; top: 0;"></span>
    <span id="reg-success" style="position: absolute; top: 0;"></span>

    <!-- POP-UP THÔNG BÁO ĐĂNG KÝ THÀNH CÔNG -->
    <div class="toast-msg toast-reg">
        <div class="toast-icon">✔</div>
        Đăng ký thành công! Vui lòng đăng nhập.
    </div>

    <a href="index.html" class="back-home">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"></polyline></svg>
        Quay lại trang chủ
    </a>

    <!-- KHUNG FORM NẰM GIỮA -->
    <div class="auth-box">
        
        <!-- ========================= FORM ĐĂNG NHẬP ========================= -->
        <div class="login-container">
            <div class="brand-logo">
                <svg viewBox="0 0 24 24" fill="#0f5132"><path d="M21 4H3a1 1 0 00-1 1v14a1 1 0 001 1h18a1 1 0 001-1V5a1 1 0 00-1-1zm-1 14H4V6h16v12z M7 8h10v2H7z M7 12h10v2H7z"/></svg>
                <span>NHÀ SÁCH ONLINE</span>
            </div>
            <h2 class="auth-title">Đăng Nhập</h2>
            <form action="">
                <div class="input-group"><input type="text" placeholder="Địa chỉ Email"></div>
                <div class="input-group"><input type="password" placeholder="Mật khẩu"></div>
                <a href="#" class="forgot-pass">Quên mật khẩu?</a>
                <!-- Bấm Đăng Nhập sẽ bay về index.html và kích hoạt popup #login-success -->
                <a href="index.html#login-success" class="btn-auth btn-login-action">ĐĂNG NHẬP</a>
            </form>

            <div class="divider">Hoặc đăng nhập bằng</div>
            <div class="social-buttons">
                <button class="social-btn"><svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"/><path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/><path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z" fill="#FBBC05"/><path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z" fill="#EA4335"/></svg></button>
                <button class="social-btn"><svg viewBox="0 0 24 24" fill="#1877F2" xmlns="http://www.w3.org/2000/svg"><path d="M24 12.073c0-6.627-5.373-12-12-12s-12 5.373-12 12c0 5.99 4.388 10.954 10.125 11.854v-8.385H7.078v-3.47h3.047V9.43c0-3.007 1.792-4.669 4.533-4.669 1.312 0 2.686.235 2.686.235v2.953H15.83c-1.491 0-1.956.925-1.956 1.874v2.25h3.328l-.532 3.47h-2.796v8.385C19.612 23.027 24 18.062 24 12.073z"/></svg></button>
            </div>
            <div class="auth-switch">Chưa có tài khoản? <a href="#dang-ky-form">Đăng ký ngay</a></div>
        </div>

        <!-- ========================= FORM ĐĂNG KÝ ========================= -->
        <div class="register-container">
            <div class="brand-logo">
                <svg viewBox="0 0 24 24" fill="#0f5132"><path d="M21 4H3a1 1 0 00-1 1v14a1 1 0 001 1h18a1 1 0 001-1V5a1 1 0 00-1-1zm-1 14H4V6h16v12z M7 8h10v2H7z M7 12h10v2H7z"/></svg>
                <span>NHÀ SÁCH ONLINE</span>
            </div>
            <h2 class="auth-title">Đăng Ký</h2>
            <form action="">
                <div class="input-group"><input type="text" placeholder="Họ và tên"></div>
                <div class="input-group"><input type="text" placeholder="Email hoặc SĐT"></div>
                <div class="input-group"><input type="password" placeholder="Tạo mật khẩu"></div>
                <div class="input-group"><input type="password" placeholder="Nhập lại mật khẩu"></div>
                <!-- Bấm Đăng Ký sẽ gọi Popup #reg-success -->
                <a href="#reg-success" class="btn-auth btn-register-action">ĐĂNG KÝ</a>
            </form>
            <div class="auth-switch">Đã có tài khoản? <a href="#">Đăng nhập</a></div>
        </div>

    </div>
</body>
</html>
