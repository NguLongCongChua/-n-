<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng Nhập Quản Trị - Hệ Thống Quản Lý Sách</title>
    <!-- Gọi file CSS riêng cho trang đăng nhập -->
    <link rel="stylesheet" href="../../css/admin/admin-login.css">
    <link rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
</head>
<body class="login-body">

        <div class="login-card">
            <h2>Quản Trị Viên</h2>
            <p>Đăng nhập vào hệ thống quản lý nhà sách</p>

            <!-- Form đăng nhập  -->
            <form id="loginForm">
                <div class="form-group">
                    <label for="username">Tên đăng nhập</label>
                    <input type="text" id="username" placeholder="Nhập tài khoản (có thể bỏ trống)...">
                </div>

                <div class="form-group">
                    <label for="password">Mật khẩu</label>
                    <input type="password" id="password" placeholder="Nhập mật khẩu (có thể bỏ trống)...">
                </div>
            <a href="./admin-dashboard.html" class="login-link">
                    <span class="btn-login">Đăng Nhập</span>
            </a>
            </form>
        </div>
    </div>

    
</body>
</html>
